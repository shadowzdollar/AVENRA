# Continuous integration (Guidelines §92). Runs on every pull request and on
# main. A change merges only when every job passes (ADR-010).
#
# Supply chain: every action is pinned to a full commit SHA (tags can be moved)
# and was released at least 7 days before it was adopted, like our packages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  contract:
    name: Contract (lint, rule self-test, TS generation, type check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make contract-check

  contract-breaking-changes:
    name: Contract (no breaking changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the contract from the target branch
        id: base
        run: |
          if git show "origin/${GITHUB_BASE_REF}:packages/contracts/openapi/avenra.v1.yaml" > base-contract.v1.yaml 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No contract on ${GITHUB_BASE_REF} yet; nothing to compare."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: base-contract.v1.yaml
          revision: packages/contracts/openapi/avenra.v1.yaml
          fail-on: ERR

  api:
    name: API (format, compile, unit + integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      # Testcontainers uses the runner's Docker for a real PostgreSQL.
      - run: make api-verify

  web:
    name: Web (lint, type check, tests, production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make web-check
      - run: pnpm --filter @avenra/web run build
        env:
          NEXT_PUBLIC_AVENRA_API_URL: http://localhost:8080

  ai:
    name: AI service (lint, format, strict types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          working-directory: apps/ai
          enable-cache: true
      - run: make ai-check

  secrets:
    name: Secret scanning (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities (Maven, pnpm, uv)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Community rules only; nothing is sent to Semgrep's cloud.
      - run: >-
          semgrep scan --error --metrics=off
          --config p/java --config p/typescript --config p/react --config p/python
          --config p/secrets --config p/dockerfile
          --exclude 'apps/api/src/test/java/fixtures'

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/*.sh infrastructure/docker/postgres/init/*.sh

  images:
    name: Container images (build + smoke tests)
    needs: [api, web, ai]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Local configuration and infrastructure for the smoke tests
        run: |
          cp .env.example .env
          make infra-up
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: avenra-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ai/Dockerfile
          tags: avenra-ai:ci
          load: true
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: NEXT_PUBLIC_AVENRA_API_URL=http://localhost:8080
          tags: avenra-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - run: TAG=ci scripts/smoke-test-images.sh
      # The scanner runs in its own container and cannot see the runner's
      # Docker images, so each image is exported to the workspace first.
      - name: Export images for scanning
        run: |
          docker save avenra-api:ci -o image-api.tar
          docker save avenra-ai:ci -o image-ai.tar
          docker save avenra-web:ci -o image-web.tar
      - name: Scan API image for vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            image
            --archive
            image-api.tar
      - name: Scan AI service image for vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            image
            --archive
            image-ai.tar
      - name: Scan web image for vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            image
            --archive
            image-web.tar
