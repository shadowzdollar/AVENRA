# Keeps pinned versions current (Guidelines §99). Every update arrives as a
# pull request and passes CI like any other change. `cooldown` applies the
# same rule as pnpm and uv: a release must be at least 7 days old.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: maven
    directory: /apps/api
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 10

  - package-ecosystem: npm # pnpm workspace (root lockfile)
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 10
    ignore:
      # ADR-012: TypeScript 7 lacks the compiler API the contract generator uses.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10 breaks eslint-plugin-react bundled with eslint-config-next.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Node type definitions follow the Node runtime (24 LTS).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: uv
    directory: /apps/ai
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/ai]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      # ADR-006: Java 25 LTS; non-LTS releases (26, 27, ...) are not adopted.
      - dependency-name: eclipse-temurin
        versions: [">=26"]
      # Node 24 LTS until a deliberate upgrade.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # Python 3.14 until a deliberate upgrade; also keeps release candidates out.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /infrastructure/docker
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
