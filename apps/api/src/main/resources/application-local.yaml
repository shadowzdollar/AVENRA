avenra:
  environment: LOCAL
  web:
    allowed-origins: http://localhost:3000
  # Every browser journey signs up new accounts from one address; locally the
  # sign-up limit is raised so the suite can run repeatedly. Elsewhere the
  # default of 5 per hour applies.
  rate-limits:
    policies:
      sign-up: { capacity: 50, refill: 1h }
  # Local receivers and storage run on loopback over plain HTTP (ADR-034).
  integrations:
    allow-loopback-http: true
  # Checkouts complete at once through the fake provider (ADR-037); the
  # secret only signs local test events.
  billing:
    provider: fake
    webhook-secret: ${AVENRA_BILLING_WEBHOOK_SECRET:local-only-billing-webhook-secret}

spring:
  mail:
    host: 127.0.0.1
    port: 11025

# Traces go to the local Jaeger started by `make infra-up` (UI: http://127.0.0.1:16686).
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:4318/v1/traces

# Human-readable logs for local development only; still shows the request id
# and structured key-value fields.
logging:
  structured:
    format:
      console: ""
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg %kvp%n%wEx"
