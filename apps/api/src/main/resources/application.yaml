# Configuration is supplied by the environment; nothing environment-specific
# is hard-coded here (Guidelines §91). A missing required value stops startup.
#
# Exactly one environment profile must be active: local, development, staging
# or production. It sets avenra.environment, which is required.
spring:
  application:
    name: avenra-api
  main:
    banner-mode: off

  # Runtime connection: the application role, which is not the schema owner and
  # cannot bypass row-level security (ADR-005).
  datasource:
    url: ${AVENRA_DB_URL}
    username: ${AVENRA_DB_APP_USER}
    password: ${AVENRA_DB_APP_PASSWORD}
    hikari:
      pool-name: avenra-app
      connection-timeout: 5000 # milliseconds
      # Sessions use UTC regardless of the JVM or host time zone (Guidelines §38).
      connection-init-sql: SET TIME ZONE 'UTC'

  # Migrations run as the owner role over a separate connection.
  flyway:
    url: ${AVENRA_DB_URL}
    user: ${AVENRA_DB_OWNER_USER}
    password: ${AVENRA_DB_OWNER_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    placeholders:
      app_role: ${AVENRA_DB_APP_USER}

  # Rate-limit counters only (ADR-016); never business data.
  data:
    redis:
      url: ${AVENRA_REDIS_URL}
      timeout: 2s
      connect-timeout: 2s

  # Transactional email over SMTP (ADR-015). Host and credentials per environment
  # (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Uploads are spooled to disk; sizes are enforced by RequestBodySizeLimitFilter
  # and the document module (ADR-019).
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
      file-size-threshold: 0

  # Request bodies must match the contract exactly: unknown fields are rejected,
  # not ignored (additionalProperties: false, Guidelines §32).
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

avenra:
  web:
    # Where people reach Avenra; used in links sent by email (AVENRA_WEB_PUBLIC_BASE_URL).
    public-base-url: ${AVENRA_WEB_PUBLIC_BASE_URL:http://localhost:3000}
    # Comma-separated list in environment variables: AVENRA_WEB_ALLOWED_ORIGINS.
    allowed-origins: []
    max-request-body-size: 1MB
    max-upload-size: 25MB
  # Documents (ADR-019) and malware scanning (ADR-021).
  documents:
    storage:
      endpoint: ${AVENRA_S3_ENDPOINT:}
      region: ${AVENRA_S3_REGION:us-east-1}
      bucket: ${AVENRA_S3_BUCKET}
      access-key: ${AVENRA_S3_ACCESS_KEY}
      secret-key: ${AVENRA_S3_SECRET_KEY}
    scanner:
      host: ${AVENRA_CLAMD_HOST:localhost}
      port: ${AVENRA_CLAMD_PORT:3310}
  # Application-level encryption (Guidelines §69, ADR-017). Keys come from the
  # environment as AVENRA_CRYPTO_KEYS_<ID>=<32 random bytes, base64>.
  crypto:
    active-key-id: ${AVENRA_CRYPTO_ACTIVE_KEY_ID}
  email:
    from: ${AVENRA_EMAIL_FROM:Avenra <no-reply@avenra.localhost>}
  # Rate-limit policies named by x-avenra-rate-limit in the contract (ADR-016).
  rate-limits:
    policies:
      default: { capacity: 120, refill: 1m }
      sign-up: { capacity: 5, refill: 1h }
      sign-in: { capacity: 20, refill: 15m }
      sign-in-account: { capacity: 10, refill: 15m }
      mfa: { capacity: 10, refill: 15m }
      password-reset: { capacity: 5, refill: 1h }
      email-send: { capacity: 5, refill: 1h }
      token-check: { capacity: 20, refill: 15m }
      invitations: { capacity: 50, refill: 1h }
      request-links: { capacity: 50, refill: 1h }
      client-requests: { capacity: 60, refill: 10m }
      uploads: { capacity: 100, refill: 1h }
      client-uploads: { capacity: 30, refill: 1h }
    fail-closed: [sign-up, sign-in, sign-in-account, mfa, password-reset, email-send, token-check, client-requests, client-uploads]

server:
  port: ${PORT:8080}
  # The web server forwards browser requests (ADR-013); trust X-Forwarded-For
  # only from internal proxy addresses, so rate limits see the real client.
  forward-headers-strategy: native
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 20s
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB
  # Errors never expose internals (Guidelines §34).
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# Health: /health/liveness and /health/readiness (Guidelines §94, ADR-011).
# Telemetry: OpenTelemetry traces exported over OTLP when an endpoint is set
# (Guidelines §60). Logs go to stdout with trace and request ids.
management:
  tracing:
    sampling:
      probability: ${AVENRA_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  opentelemetry:
    resource-attributes:
      service.name: avenra-api
      service.version: "@project.version@"
      deployment.environment.name: ${avenra.environment}
    # The OTLP trace exporter is created only when an endpoint is configured:
    # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT in deployments,
    # the local Jaeger under the local profile.
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: ${AVENRA_OTLP_METRICS_ENABLED:false}
        url: ${AVENRA_OTLP_METRICS_URL:http://127.0.0.1:4318/v1/metrics}
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,malwareScanner
  # Email is sent after commit with retries; an SMTP outage must not take the
  # API out of service, so mail is not part of health.
  health:
    mail:
      enabled: false

# Structured JSON logs (Guidelines §62). The local profile switches to plain text.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: avenra-api
        # Filled in at build time from the Maven project version.
        version: "@project.version@"
        environment: ${avenra.environment}
