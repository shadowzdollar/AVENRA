# Integration tests use production-like settings (JSON logs) against
# Testcontainers. Database, Redis and encryption keys are supplied by
# PostgresTestDatabase and TestServices.
avenra:
  environment: LOCAL
  web:
    allowed-origins: https://app.avenra.test
    max-request-body-size: 4KB
    # Small, so size limits are cheap to test.
    max-upload-size: 256KB
  # All tests share one client address; generous limits keep unrelated tests
  # independent. RateLimitIT runs with strict limits of its own.
  rate-limits:
    policies:
      default: { capacity: 100000, refill: 1m }
      sign-up: { capacity: 100000, refill: 1m }
      sign-in: { capacity: 100000, refill: 1m }
      sign-in-account: { capacity: 100000, refill: 1m }
      mfa: { capacity: 100000, refill: 1m }
      password-reset: { capacity: 100000, refill: 1m }
      email-send: { capacity: 100000, refill: 1m }
      token-check: { capacity: 100000, refill: 1m }
      invitations: { capacity: 100000, refill: 1m }
      request-links: { capacity: 100000, refill: 1m }
      client-requests: { capacity: 100000, refill: 1m }
      uploads: { capacity: 100000, refill: 1m }
      client-uploads: { capacity: 100000, refill: 1m }

  # Integrations (ADR-034): tests deliver to receivers on loopback, with fast
  # retries and an early pause.
  integrations:
    allow-loopback-http: true
    first-retry: 200ms
    max-retry: 1s
    max-attempts: 3
    pause-after: 2

  # Fast jobs for tests (ADR-022). Schedules fire once at start; tests fire
  # them explicitly when they need to.
  jobs:
    poll-interval: 100ms
    retry-base: 200ms
    retry-cap: 1s
    schedule-interval: 1h

# Tests capture email with TestOutbox; this SMTP host is never contacted.
spring:
  mail:
    host: localhost
    port: 1
