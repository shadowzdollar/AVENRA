          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/integrations/{connectionId}/deliveries:
    get:
      operationId: listIntegrationDeliveries
      summary: Recent deliveries of a connection
      tags:
      - integrations
      x-avenra-permission: integration.read
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Newest first, at most 100.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationDelivery'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/integrations/{connectionId}/deliveries/{deliveryId}/redelivery:
    post:
      operationId: redeliverIntegrationDelivery
      summary: Deliver an event again
      tags:
      - integrations
      x-avenra-permission: integration.manage
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ConnectionId'
      - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Queued again.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationDelivery'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  headers:
    RequestId:
      description: Correlation id of the request, also present in error bodies and server logs.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying (on `429`).
      schema:
        type: integer
  responses:
    ClientError:
      description: The request was rejected. See `code` for the reason.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: The server failed to handle the request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiMeta:
      type: object
      additionalProperties: false
      required:
      - service
      - apiVersion
      properties:
        service:
          type: string
          description: Name of the service answering the request.
          examples:
          - avenra-api
        apiVersion:
          type: string
          description: Major version of the API contract.
          examples:
          - v1
    ErrorResponse:
      type: object
      additionalProperties: false
      description: The single error format of the API (Guidelines §34).
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples:
          - VALIDATION_FAILED
        message:
          type: string
          description: Human-readable explanation, safe to show to users.
        requestId:
          type: string
          description: Correlation id; equals the `X-Request-Id` response header.
        details:
          type: array
          description: Per-field problems, present for validation errors only.
          items:
            $ref: '#/components/schemas/FieldProblem'
    FieldProblem:
      type: object
      additionalProperties: false
      required:
      - field
      - problem
      properties:
        field:
          type: string
          description: The request field, as named in this contract.
        problem:
          type: string
          description: What is wrong with the field.
    SignUpRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters (ADR-014).
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    EmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
          description: Single-use token from an email link.
    SignInRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    SignInResult:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - SIGNED_IN
          - MFA_REQUIRED
        mfaChallengeId:
          type: string
          format: uuid
          description: Present when `status` is `MFA_REQUIRED`; valid for 5 minutes.
    MfaSignInRequest:
      type: object
      additionalProperties: false
      required:
      - mfaChallengeId
      - code
      properties:
        mfaChallengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$|^[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$
          description: A 6-digit authenticator code or a recovery code.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters (ADR-014).
    PasswordResetConfirmation:
      type: object
      additionalProperties: false
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
          description: Single-use token from an email link.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters (ADR-014).
    TotpEnrollment:
      type: object
      additionalProperties: false
      required:
      - secret
      - otpauthUri
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauthUri:
          type: string
          description: '`otpauth://` URI for a QR code.'
    TotpCodeRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$|^[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$
          description: A 6-digit authenticator code or a recovery code.
    RecoveryCodes:
      type: object
      additionalProperties: false
      required:
      - codes
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - mfaEnabled
      - organizations
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
        mfaEnabled:
          type: boolean
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
    SessionSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - current
      - createdAt
      - lastSeenAt
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        userAgent:
          type: string
          maxLength: 300
    Organization:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    OrganizationMembership:
      type: object
      additionalProperties: false
      required:
      - organization
      - membershipId
      - role
      - permissions
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membershipId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
          description: Permissions granted by the role, for the interface to adapt; the server checks
            them independently.
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    Member:
      type: object
      additionalProperties: false
      required:
      - membershipId
      - userId
      - email
      - displayName
      - role
      - joinedAt
      properties:
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    InviteRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - role
      - invitedAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
        invitedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Role:
      type: string
      enum:
      - OWNER
      - ADMIN
      - MANAGER
      - MEMBER
      - VIEWER
      description: Role within an organization (Guidelines §18).
    ClientInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
          description: Default contact address.
        reference:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's own reference for the client.
    Client:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        reference:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        clientId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 0
          maxLength: 4000
    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clientId:
          type: string
          format: uuid
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkStatus:
      type: string
      enum:
      - DRAFT
      - READY
      - RUNNING
      - WAITING_FOR_INFORMATION
      - WAITING_FOR_APPROVAL
      - BLOCKED
      - FAILED
      - COMPLETED
      - CANCELLED
      description: Lifecycle of work (Guidelines §19, ADR-018).
    Priority:
      type: string
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
    CreateWorkRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 10000
        type:
          type: string
          minLength: 1
          maxLength: 60
          description: Kind of work, e.g. `onboarding`.
        priority:
          $ref: '#/components/schemas/Priority'
        clientId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        ownerMembershipId:
          type: string
          format: uuid
          description: The member responsible; defaults to the creator.
    UpdateWorkRequest:
      type: object
      additionalProperties: false
      description: Only the fields present are changed.
      required: []
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 10000
        type:
          type: string
          minLength: 1
          maxLength: 60
        priority:
          $ref: '#/components/schemas/Priority'
        dueAt:
          type: string
          format: date-time
        ownerMembershipId:
          type: string
          format: uuid
    Completeness:
      type: object
      additionalProperties: false
      description: Computed by the server from the requirements (ADR-018).
      required:
      - required
      - accepted
      - awaitingReview
      - missing
      - rejected
      - complete
      properties:
        required:
          type: integer
          minimum: 0
          description: Required requirements.
        accepted:
          type: integer
          minimum: 0
          description: Required requirements accepted.
        awaitingReview:
          type: integer
          minimum: 0
        missing:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
          description: Waiting for a correction.
        complete:
          type: boolean
          description: Every required requirement is accepted.
    WorkSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - status
      - priority
      - completeness
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
        status:
          $ref: '#/components/schemas/WorkStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        clientId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        ownerMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        completeness:
          $ref: '#/components/schemas/Completeness'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        openExceptions:
          type: integer
          minimum: 0
    WorkDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - status
      - priority
      - completeness
      - requestedByUserId
      - createdAt
      - updatedAt
      - requirements
      - tasks
      - allowedTransitions
      - progress
      - completionCriteria
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
        status:
          $ref: '#/components/schemas/WorkStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        clientId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        ownerMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        completeness:
          $ref: '#/components/schemas/Completeness'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        description:
          type: string
        requestedByUserId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        completionReason:
          type: string
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkStatus'
          description: Statuses reachable from the current one.
        progress:
          $ref: '#/components/schemas/Progress'
        completionCriteria:
          type: array
          items:
            $ref: '#/components/schemas/CompletionCriterion'
          description: What completing the work requires (ADR-028).
    TransitionRequest:
      type: object
      additionalProperties: false
      required:
      - to
      - expectedStatus
      properties:
        to:
          $ref: '#/components/schemas/WorkStatus'
        expectedStatus:
          $ref: '#/components/schemas/WorkStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why; required for `BLOCKED`, `FAILED` and `CANCELLED`.
    WorkTransition:
      type: object
      additionalProperties: false
      required:
      - id
      - to
      - at
      properties:
        id:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/WorkStatus'
        to:
          $ref: '#/components/schemas/WorkStatus'
        actorUserId:
          type: string
          format: uuid
        reason:
          type: string
        at:
          type: string
          format: date-time
        actorRule:
          type: string
          description: Set when the platform moved the work (ADR-023).
    TaskStatus:
      type: string
      enum:
      - OPEN
      - DONE
      - CANCELLED
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - completionCondition
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        completionCondition:
          type: string
          minLength: 1
          maxLength: 1000
          description: What must be true for the task to be done (Guidelines §20).
        assigneeMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
    TaskStatusRequest:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - DONE
          - CANCELLED
        note:
          type: string
          minLength: 1
          maxLength: 1000
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - kind
      - completionCondition
      - status
      - createdAt
      - origin
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
          enum:
          - HUMAN
        completionCondition:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        assigneeMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        note:
          type: string
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        origin:
          type: string
          enum:
          - MANUAL
          - SYSTEM
          description: System tasks are created and closed by the platform (ADR-024).
        requiredAction:
          type: string
        reason:
          type: string
        choices:
          type: array
          items:
            type: string
        about:
          $ref: '#/components/schemas/Reference'
    RequirementKind:
      type: string
      enum:
      - DOCUMENT
      - TEXT
      - NUMBER
      - DATE
      - BOOLEAN
      description: 'What satisfies the requirement: a file, or a value of a type.'
    RequirementState:
      type: string
      enum:
      - MISSING
      - SUBMITTED
      - ACCEPTED
      - REJECTED
      description: Derived from the current information item (ADR-018).
    CreateRequirementRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - kind
      - required
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        instructions:
          type: string
          minLength: 0
          maxLength: 2000
          description: Shown to the client.
        kind:
          $ref: '#/components/schemas/RequirementKind'
        required:
          type: boolean
        rules:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/VerificationRuleInput'
        acceptance:
          $ref: '#/components/schemas/Acceptance'
        risk:
          $ref: '#/components/schemas/Risk'
    Requirement:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - kind
      - required
      - state
      - createdAt
      - rules
      - acceptance
      - risk
      - rulesVersion
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        kind:
          $ref: '#/components/schemas/RequirementKind'
        required:
          type: boolean
        state:
          $ref: '#/components/schemas/RequirementState'
        currentItem:
          $ref: '#/components/schemas/InformationItem'
        createdAt:
          type: string
          format: date-time
        rules:
          type: array
          items:
            $ref: '#/components/schemas/VerificationRule'
        acceptance:
          $ref: '#/components/schemas/Acceptance'
        risk:
          $ref: '#/components/schemas/Risk'
        rulesVersion:
          type: integer
          minimum: 0
    ValueSubmission:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4000
          description: Text; a decimal number (`NUMBER`); `YYYY-MM-DD` (`DATE`); `true` or `false` (`BOOLEAN`).
    FileUpload:
      type: object
      additionalProperties: false
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: At most 25 MB; PDF, Word, Excel, PowerPoint, CSV, text, PNG or JPEG.
    InformationSource:
      type: object
      additionalProperties: false
      description: Where the information came from (Guidelines §136).
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - CLIENT_LINK
          - TEAM_MEMBER
        requestLinkId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    VerificationState:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - REJECTED
    InformationItem:
      type: object
      additionalProperties: false
      required:
      - id
      - requirementId
      - kind
      - source
      - receivedAt
      - verification
      properties:
        id:
          type: string
          format: uuid
        requirementId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/RequirementKind'
        value:
          type: string
          description: Present for value requirements.
        document:
          $ref: '#/components/schemas/DocumentVersion'
        source:
          $ref: '#/components/schemas/InformationSource'
        receivedAt:
          type: string
          format: date-time
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Set by automated verification (Phase 5).
        verification:
          $ref: '#/components/schemas/Verification'
        checks:
          $ref: '#/components/schemas/VerificationResult'
        reading:
          $ref: '#/components/schemas/DocumentReading'
    Verification:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          $ref: '#/components/schemas/VerificationState'
        reviewedByUserId:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        reason:
          type: string
        decidedBy:
          type: string
          enum:
          - PERSON
          - RULES
          description: 'Who decided: a person or the rules.'
        overrideReason:
          type: string
          description: Why a person accepted despite failed checks.
    DocumentVersion:
      type: object
      additionalProperties: false
      required:
      - documentId
      - version
      - fileName
      - contentType
      - sizeBytes
      - sha256
      - scanStatus
      - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        fileName:
          type: string
        contentType:
          type: string
          description: Detected from the content, not declared by the uploader.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        scanStatus:
          type: string
          enum:
          - CLEAN
          - INFECTED
        uploadedAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      additionalProperties: false
      required:
      - itemId
      - decision
      properties:
        itemId:
          type: string
          format: uuid
          description: The item being reviewed; must be the current one.
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required when rejecting; shown to the client.
        overrideReason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required to accept an answer whose checks failed or need review (`OVERRIDE_REQUIRED`).
    CreateRequestLinkRequest:
      type: object
      additionalProperties: false
      required:
      - recipientEmail
      - requirementIds
      properties:
        recipientEmail:
          type: string
          format: email
          maxLength: 254
        recipientName:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 0
          maxLength: 2000
          description: Shown to the client with the request.
        requirementIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Requirements of this work the link covers; duplicates are ignored.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 14
    RequestLink:
      type: object
      additionalProperties: false
      required:
      - id
      - recipientEmail
      - requirementIds
      - status
      - createdAt
      - expiresAt
      - remindersSent
      properties:
        id:
          type: string
          format: uuid
        recipientEmail:
          type: string
          format: email
        recipientName:
          type: string
        message:
          type: string
        requirementIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - REVOKED
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastOpenedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        remindersSent:
          type: integer
          minimum: 0
        lastRemindedAt:
          type: string
          format: date-time
    ClientRequest:
      type: object
      additionalProperties: false
      description: 'What a request link shows: only its own requirements, never earlier files or other
        work.'
      required:
      - organizationName
      - workTitle
      - recipient
      - expiresAt
      - items
      - documentsReadAutomatically
      properties:
        organizationName:
          type: string
        workTitle:
          type: string
        recipient:
          type: string
          description: The recipient's email address, masked.
        message:
          type: string
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientRequestItem'
        documentsReadAutomatically:
          type: boolean
          description: The organization lets documents be read automatically to check them; people make
            the decisions.
    ClientRequestItem:
      type: object
      additionalProperties: false
      required:
      - requirementId
      - title
      - kind
      - required
      - state
      properties:
        requirementId:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        kind:
          $ref: '#/components/schemas/RequirementKind'
        required:
          type: boolean
        state:
          $ref: '#/components/schemas/RequirementState'
        rejectionReason:
          type: string
          description: Why the last answer was not accepted.
        acceptedFileTypes:
          type: array
          items:
            type: string
          description: 'For documents: accepted file extensions.'
        problems:
          type: array
          items:
            type: string
          description: What is wrong with the last answer, from the blocking checks.
    ExceptionStatus:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - WAITING
      - RESOLVED
      - DISMISSED
    WorkException:
      type: object
      additionalProperties: false
      description: 'A business exception: a normal state that needs a person (Guidelines §26, ADR-024).'
      required:
      - id
      - type
      - severity
      - description
      - source
      - status
      - createdAt
      - allowedTransitions
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - JOB_FAILED
          - DELIVERY_FAILED
          - REQUEST_EXPIRED_INCOMPLETE
          - WORK_OVERDUE
          - MALWARE_FOUND
          - HUMAN_REQUIRED
          - INCONSISTENT_INFORMATION
          description: 'What raised the exception. New types are added over time: treat a type you do
            not know as a generic exception.'
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        description:
          type: string
          description: What happened and what is needed.
        source:
          type: object
          additionalProperties: false
          description: What raised the exception.
          required:
          - type
          - id
          properties:
            type:
              type: string
            id:
              type: string
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        assigneeMembershipId:
          type: string
          format: uuid
        resolution:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        resolvedByUserId:
          type: string
          format: uuid
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionStatus'
    ExceptionTransitionRequest:
      type: object
      additionalProperties: false
      required:
      - to
      - expectedStatus
      properties:
        to:
          $ref: '#/components/schemas/ExceptionStatus'
        expectedStatus:
          $ref: '#/components/schemas/ExceptionStatus'
        resolution:
          type: string
          minLength: 1
          maxLength: 2000
          description: Required for `RESOLVED` and `DISMISSED`.
    AssignExceptionRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        assigneeMembershipId:
          type:
          - string
          - 'null'
          format: uuid
          description: The member responsible; null to unassign.
    Execution:
      type: object
      additionalProperties: false
      description: One attempt to perform an action (Guidelines §28, ADR-023).
      required:
      - id
      - actor
      - action
      - status
      - retryCount
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        step:
          $ref: '#/components/schemas/Reference'
        actor:
          type: object
          additionalProperties: false
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - USER
              - SYSTEM
            userId:
              type: string
              format: uuid
            rule:
              type: string
              description: 'For system actions: the rule that acted.'
        action:
          type: string
          examples:
          - request_link.remind
        target:
          type: string
        status:
          type: string
          enum:
          - PLANNED
          - AUTHORIZED
          - READY
          - RUNNING
          - WAITING
          - REQUIRES_APPROVAL
          - FAILED
          - SUCCEEDED
          - VERIFIED
          - COMPLETED
          - CANCELLED
        result:
          type: object
          additionalProperties:
            type: string
          description: What the action produced, as named values.
        error:
          type: string
        retryCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    Progress:
      type: object
      additionalProperties: false
      description: What a person needs to know without reading logs (Guidelines §107).
      required:
      - currentStep
      - nextAction
      properties:
        currentStep:
          type: string
          description: Where the work stands, in words.
        nextAction:
          type: string
          description: What happens next and who does it.
        blockedReason:
          type: string
        openExceptions:
          type: integer
          minimum: 0
        openTasks:
          type: integer
          minimum: 0
    Reference:
      type: object
      additionalProperties: false
      description: 'Points at another resource: its kind and id.'
      required:
      - type
      - id
      properties:
        type:
          type: string
          examples:
          - requirement
        id:
          type: string
          format: uuid
    RuleType:
      type: string
      enum:
      - PATTERN
      - LENGTH
      - ONE_OF
      - RANGE
      - DATE_RANGE
      - EQUALS_REQUIREMENT
      - DATE_ORDER
      - FILE_TYPE
      - FILE_SIZE
      - DOCUMENT_KIND
      - DOCUMENT_FIELD
      description: '`DOCUMENT_KIND` and `DOCUMENT_FIELD` read the document with AI (ADR-031); they are
        always `ADVISORY` and only run while the organization has document reading switched on.'
    RuleSeverity:
      type: string
      enum:
      - BLOCKING
      - ADVISORY
      description: Blocking failures reject the answer; advisory ones need a person (ADR-027).
    VerificationRuleInput:
      type: object
      additionalProperties: false
      description: One deterministic check (ADR-027). Only the fields of its type apply.
      required:
      - type
      - severity
      - message
      properties:
        type:
          $ref: '#/components/schemas/RuleType'
        severity:
          $ref: '#/components/schemas/RuleSeverity'
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: Shown when the check fails, also to the client for blocking rules.
        pattern:
          type: string
          minLength: 1
          maxLength: 200
          description: '`PATTERN`: a regular expression the whole value must match.'
        minLength:
          type: integer
          minimum: 0
          maximum: 4000
        maxLength:
          type: integer
          minimum: 1
          maximum: 4000
        values:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: '`ONE_OF`: allowed values (text compares ignoring case). `DOCUMENT_KIND`: the kinds
            of document that are acceptable, e.g. "passport". Required (non-empty) for these rule types;
            checked when the rule is defined.'
        min:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: '`RANGE`: smallest allowed number.'
        max:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: '`RANGE`: largest allowed number.'
        notBefore:
          type: string
          format: date
        notAfter:
          type: string
          format: date
        minDaysFromToday:
          type: integer
          minimum: -36500
          maximum: 36500
          description: '`DATE_RANGE`, and `DOCUMENT_FIELD` with a date field: at least this many days
            from the day of the check (e.g. 30: not expiring within a month).'
        maxDaysFromToday:
          type: integer
          minimum: -36500
          maximum: 36500
        field:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z][A-Za-z0-9 _-]*$
          description: '`DOCUMENT_FIELD`: the field to read, as it is labelled in the document, e.g. "Date
            of expiry".'
        fieldKind:
          $ref: '#/components/schemas/FieldKind'
        otherRequirementId:
          type: string
          format: uuid
          description: '`EQUALS_REQUIREMENT`, `DATE_ORDER`: a requirement of the same work. `DOCUMENT_FIELD`:
            the field must equal that requirement''s answer.'
        order:
          type: string
          enum:
          - BEFORE
          - AFTER
          description: '`DATE_ORDER`: this date relative to the other.'
        contentTypes:
          type: array
          maxItems: 10
          items:
            type: string
          description: '`FILE_TYPE`: accepted detected types, e.g. `application/pdf`. Required (non-empty)
            for its rule type; checked when the rule is defined.'
        maxBytes:
          type: integer
          format: int64
          minimum: 1
          description: '`FILE_SIZE`: largest file.'
    VerificationRule:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - severity
      - message
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RuleType'
        severity:
          $ref: '#/components/schemas/RuleSeverity'
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: Shown when the check fails, also to the client for blocking rules.
        pattern:
          type: string
          minLength: 1
          maxLength: 200
          description: '`PATTERN`: a regular expression the whole value must match.'
        minLength:
          type: integer
          minimum: 0
          maximum: 4000
        maxLength:
          type: integer
          minimum: 1
          maximum: 4000
        values:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: '`ONE_OF`: allowed values (text compares ignoring case). `DOCUMENT_KIND`: the kinds
            of document that are acceptable, e.g. "passport". Required (non-empty) for these rule types;
            checked when the rule is defined.'
        min:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: '`RANGE`: smallest allowed number.'
        max:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: '`RANGE`: largest allowed number.'
        notBefore:
          type: string
          format: date
        notAfter:
          type: string
          format: date
        minDaysFromToday:
          type: integer
          minimum: -36500
          maximum: 36500
          description: '`DATE_RANGE`, and `DOCUMENT_FIELD` with a date field: at least this many days
            from the day of the check (e.g. 30: not expiring within a month).'
        maxDaysFromToday:
          type: integer
          minimum: -36500
          maximum: 36500
        field:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z][A-Za-z0-9 _-]*$
          description: '`DOCUMENT_FIELD`: the field to read, as it is labelled in the document, e.g. "Date
            of expiry".'
        fieldKind:
          $ref: '#/components/schemas/FieldKind'
        otherRequirementId:
          type: string
          format: uuid
          description: '`EQUALS_REQUIREMENT`, `DATE_ORDER`: a requirement of the same work. `DOCUMENT_FIELD`:
            the field must equal that requirement''s answer.'
        order:
          type: string
          enum:
          - BEFORE
          - AFTER
          description: '`DATE_ORDER`: this date relative to the other.'
        contentTypes:
          type: array
          maxItems: 10
          items:
            type: string
          description: '`FILE_TYPE`: accepted detected types, e.g. `application/pdf`. Required (non-empty)
            for its rule type; checked when the rule is defined.'
        maxBytes:
          type: integer
          format: int64
          minimum: 1
          description: '`FILE_SIZE`: largest file.'
    Acceptance:
      type: string
      enum:
      - MANUAL
      - AUTOMATIC
      description: '`AUTOMATIC`: answers that pass every check with enough confidence are accepted by
        the platform; not allowed for high-risk requirements.'
    Risk:
      type: string
      enum:
      - NORMAL
      - HIGH
      description: High-risk requirements are always decided by a person.
    RequirementRulesInput:
      type: object
      additionalProperties: false
      required:
      - rules
      - acceptance
      - risk
      properties:
        rules:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/VerificationRuleInput'
        acceptance:
          $ref: '#/components/schemas/Acceptance'
        risk:
          $ref: '#/components/schemas/Risk'
    CheckResult:
      type: object
      additionalProperties: false
      required:
      - rule
      - outcome
      - severity
      - message
      - aiDerived
      properties:
        ruleId:
          type: string
          format: uuid
        rule:
          $ref: '#/components/schemas/RuleType'
        outcome:
          type: string
          enum:
          - PASSED
          - FAILED
          - SKIPPED
          description: '`SKIPPED`: the check could not run yet (e.g. the other answer is missing).'
        severity:
          $ref: '#/components/schemas/RuleSeverity'
        message:
          type: string
        detail:
          type: string
        aiDerived:
          type: boolean
          description: 'The check is based on an automatic reading of the document: advisory, never a
            decision (ADR-031).'
    VerificationResult:
      type: object
      additionalProperties: false
      description: A structured verification (Guidelines §25, ADR-027). Immutable.
      required:
      - id
      - itemId
      - status
      - checks
      - evidence
      - method
      - rulesVersion
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PASSED
          - FAILED
          - NEEDS_REVIEW
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Share of passed check weight; unset when there are no rules. Describes the checks,
            not the truth.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        method:
          type: string
          enum:
          - RULES
        rulesVersion:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    CompletionCriterion:
      type: object
      additionalProperties: false
      required:
      - name
      - met
      - description
      properties:
        name:
          type: string
          enum:
          - REQUIREMENTS_ACCEPTED
          - CHECKS_PASSED
          - NO_HIGH_EXCEPTIONS
          - TASKS_CLOSED
        met:
          type: boolean
        description:
          type: string
        detail:
          type: string
    Evidence:
      type: object
      additionalProperties: false
      description: First-class evidence (Guidelines §24, ADR-028). Immutable.
      required:
      - id
      - kind
      - reference
      - description
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - ANSWER
          - DOCUMENT_VERSION
          - VERIFICATION
          - HUMAN_DECISION
          - SYSTEM_DECISION
        requirementId:
          type: string
          format: uuid
        reference:
          $ref: '#/components/schemas/Reference'
        description:
          type: string
        fingerprint:
          type: string
          description: SHA-256 of the evidenced content, where there is one.
        createdAt:
          type: string
          format: date-time
    CompletionManifest:
      type: object
      additionalProperties: false
      description: Proof of verified completion (ADR-028).
      required:
      - workId
      - completedAt
      - manifest
      - sha256
      - intact
      properties:
        workId:
          type: string
          format: uuid
        completedAt:
          type: string
          format: date-time
        manifest:
          type: string
          description: 'Canonical JSON: the work, criteria, and per requirement the accepted answer, verification
            and decision.'
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        intact:
          type: boolean
          description: The stored manifest still matches its hash.
    FieldKind:
      type: string
      enum:
      - TEXT
      - NUMBER
      - DATE
      description: How a field read from a document is compared.
    DocumentReading:
      type: object
      additionalProperties: false
      description: What an automatic reading found in a document (ADR-031). Untrusted until a person decides;
        quotes point to the source.
      required:
      - status
      - fields
      - instructionsDetected
      - proposals
      properties:
        status:
          type: string
          enum:
          - PENDING
          - DONE
          - FAILED
          - SKIPPED
          description: '`SKIPPED`: not read, see `reason`.'
        reason:
          type: string
          description: Why the document was not read, or why reading failed.
        kind:
          type: object
          additionalProperties: false
          required:
          - label
          - confidence
          properties:
            label:
              type: string
              description: One of the kinds the rules list, or `other`.
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: Reported by the model; not a verification.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DocumentField'
        instructionsDetected:
          type: boolean
          description: The document contains text addressed to an automated reader.
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/AiProposal'
        model:
          type: string
        readAt:
          type: string
          format: date-time
    DocumentField:
      type: object
      additionalProperties: false
      required:
      - name
      - kind
      - found
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/FieldKind'
        found:
          type: boolean
        value:
          type: string
          description: 'Canonical form: YYYY-MM-DD, a decimal number, or text.'
        quote:
          type: string
          description: The passage the value comes from.
        page:
          type: integer
          minimum: 1
        located:
          type: boolean
          description: Whether the quote was found in the document text; absent when the document has
            no text (images, scans).
    AiProposal:
      type: object
      additionalProperties: false
      required:
      - tool
      - risk
      - reason
      description: An action the model suggests. Never carried out automatically; a person decides (ADR-029).
      properties:
        tool:
          type: string
          enum:
          - request_clearer_copy
          - flag_for_review
        risk:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        reason:
          type: string
    AiSettings:
      type: object
      additionalProperties: false
      required:
      - documentReading
      - dailyCallLimit
      - workPlanning
      properties:
        documentReading:
          type: boolean
          description: Whether clients' documents may be read automatically. Off by default.
        dailyCallLimit:
          type: integer
          minimum: 0
          description: Most AI calls per UTC day for the organization.
        updatedAt:
          type: string
          format: date-time
        updatedByUserId:
          type: string
          format: uuid
        workPlanning:
          type: boolean
          description: Whether the assistant may plan work (sends work details to the AI provider). Off
            by default.
    AiSettingsInput:
      type: object
      additionalProperties: false
      required:
      - documentReading
      properties:
        documentReading:
          type: boolean
        workPlanning:
          type: boolean
    AiInvocation:
      type: object
      additionalProperties: false
      required:
      - id
      - purpose
      - provider
      - modelRequested
      - promptName
      - promptVersion
      - inputTokens
      - outputTokens
      - cacheReadTokens
      - latencyMs
      - outcome
      - attempt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - document.read
          - work.plan
        subjectId:
          type: string
          format: uuid
          description: The document read.
        subjectVersion:
          type: integer
          minimum: 1
        provider:
          type: string
        modelRequested:
          type: string
        model:
          type: string
          description: The model that answered.
        promptName:
          type: string
        promptVersion:
          type: integer
          minimum: 1
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        cacheReadTokens:
          type: integer
          minimum: 0
        latencyMs:
          type: integer
          minimum: 0
        estimatedCostMicros:
          type: integer
          format: int64
          minimum: 0
          description: Estimated cost in millionths of a US dollar.
        outcome:
          type: string
          enum:
          - SUCCEEDED
          - REFUSED
          - INVALID_OUTPUT
          - TRUNCATED
          - FAILED
        errorCode:
          type: string
        attempt:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    AiUsage:
      type: object
      additionalProperties: false
      required:
      - today
      - dailyCallLimit
      - invocations
      properties:
        today:
          type: object
          additionalProperties: false
          required:
          - calls
          - inputTokens
          - outputTokens
          - estimatedCostMicros
          properties:
            calls:
              type: integer
              minimum: 0
            inputTokens:
              type: integer
              format: int64
              minimum: 0
            outputTokens:
              type: integer
              format: int64
              minimum: 0
            estimatedCostMicros:
              type: integer
              format: int64
              minimum: 0
        dailyCallLimit:
          type: integer
          minimum: 0
        invocations:
          type: array
          items:
            $ref: '#/components/schemas/AiInvocation'
          description: Newest first, at most 100.
    AgentRunStatus:
      type: string
      enum:
      - PLANNING
      - AWAITING_APPROVAL
      - RUNNING
      - COMPLETED
      - REJECTED
      - STOPPED
      - FAILED
    AgentStepStatus:
      type: string
      enum:
      - PROPOSED
      - APPROVED
      - RUNNING
      - SUCCEEDED
      - REJECTED
      - FAILED
      - SKIPPED
    ToolRisk:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    AgentBudget:
      type: object
      additionalProperties: false
      required:
      - maxModelCalls
      - maxToolCalls
      - maxSideEffects
      - maxCostMicros
      - deadline
      - modelCalls
      - toolCalls
      - sideEffects
      - costMicros
      properties:
        maxModelCalls:
          type: integer
          minimum: 0
        maxToolCalls:
          type: integer
          minimum: 0
        maxSideEffects:
          type: integer
          minimum: 0
        modelCalls:
          type: integer
          minimum: 0
        toolCalls:
          type: integer
          minimum: 0
        sideEffects:
          type: integer
          minimum: 0
        maxCostMicros:
          type: integer
          format: int64
          minimum: 0
        costMicros:
          type: integer
          format: int64
          minimum: 0
        deadline:
          type: string
          format: date-time
    AgentStep:
      type: object
      additionalProperties: false
      required:
      - id
      - position
      - tool
      - risk
      - input
      - status
      - needsOwnApproval
      - attempts
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        tool:
          type: string
          enum:
          - create_requirement
          - create_task
          - send_information_request
        description:
          type: string
          description: What the step will do, in words.
        reason:
          type: string
          description: Why the assistant proposed it.
        risk:
          $ref: '#/components/schemas/ToolRisk'
        input:
          type: object
          additionalProperties: true
          description: The validated input of the tool.
        status:
          $ref: '#/components/schemas/AgentStepStatus'
        needsOwnApproval:
          type: boolean
          description: High-risk steps are approved one by one.
        approvedByUserId:
          type: string
          format: uuid
        approvedAt:
          type: string
          format: date-time
        attempts:
          type: integer
          minimum: 0
        result:
          type: string
          description: What the step did, once verified.
        error:
          type: string
        finishedAt:
          type: string
          format: date-time
    AgentRun:
      type: object
      additionalProperties: false
      required:
      - id
      - workId
      - capability
      - status
      - startedByUserId
      - budget
      - steps
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        capability:
          type: string
          enum:
          - information.plan
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        summary:
          type: string
        startedByUserId:
          type: string
          format: uuid
        budget:
          $ref: '#/components/schemas/AgentBudget'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AgentStep'
        stopReason:
          type: string
          description: Why the run stopped, failed or was rejected.
        traceId:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    AgentApprovalRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        highRiskStepIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
          description: High-risk steps approved now as well. Others stay waiting for their own approval.
        reason:
          type: string
          maxLength: 1000
    AgentStopRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    IntegrationProvider:
      type: string
      enum:
      - WEBHOOK
      - S3_EXPORT
    IntegrationStatus:
      type: string
      enum:
      - ACTIVE
      - PAUSED
      - REVOKED
      description: '`PAUSED`: nothing is delivered until resumed (also set after repeated failures).'
    IntegrationEventType:
      type: string
      enum:
      - work.completed
      - information.answer_received
      - request.expired
      description: Event types connections can subscribe to. New types are added over time.
    IntegrationCapability:
      type: string
      enum:
      - events.deliver
      - storage.export_completion
    IntegrationSettings:
      type: object
      additionalProperties: false
      description: Non-secret settings of a connection.
      properties:
        url:
          type: string
          maxLength: 2000
          description: '`WEBHOOK`: where events are sent (HTTPS).'
          pattern: ^https?://\S+$
        endpoint:
          type: string
          maxLength: 2000
          description: '`S3_EXPORT`: the S3-compatible endpoint (HTTPS); empty for AWS.'
          pattern: ^https?://\S+$
        region:
          type: string
          maxLength: 64
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        prefix:
          type: string
          maxLength: 200
          description: '`S3_EXPORT`: folder for exports, e.g. `avenra/`.'
        pathStyle:
          type: boolean
    IntegrationConnection:
      type: object
      additionalProperties: false
      required:
      - id
      - provider
      - name
      - status
      - capabilities
      - events
      - settings
      - consecutiveFailures
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/IntegrationProvider'
        name:
          type: string
        status:
          $ref: '#/components/schemas/IntegrationStatus'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationCapability'
        events:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationEventType'
        settings:
          $ref: '#/components/schemas/IntegrationSettings'
        credentialHint:
          type: string
          description: Enough to recognise the credential (e.g. the last characters of an access key),
            never the secret.
        consecutiveFailures:
          type: integer
          minimum: 0
        lastDeliveryAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IntegrationCredentialsInput:
      type: object
      additionalProperties: false
      description: '`S3_EXPORT` only; webhooks get a secret generated by Avenra.'
      properties:
        accessKey:
          type: string
          minLength: 1
          maxLength: 200
        secretKey:
          type: string
          minLength: 1
          maxLength: 200
          writeOnly: true
    CreateIntegrationRequest:
      type: object
      additionalProperties: false
      required:
      - provider
      - name
      - settings
      properties:
        provider:
          $ref: '#/components/schemas/IntegrationProvider'
        name:
          type: string
          minLength: 1
          maxLength: 100
        events:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/IntegrationEventType'
          description: '`WEBHOOK`: the events to send.'
        settings:
          $ref: '#/components/schemas/IntegrationSettings'
        credentials:
          $ref: '#/components/schemas/IntegrationCredentialsInput'
    UpdateIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        events:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/IntegrationEventType'
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
    IntegrationSecret:
      type: object
      additionalProperties: false
      required:
      - connection
      description: Returned only when a connection is created or its credentials rotated.
      properties:
        connection:
          $ref: '#/components/schemas/IntegrationConnection'
        signingSecret:
          type: string
          description: '`WEBHOOK`: the secret to verify signatures. Shown once; store it now.'
    IntegrationDelivery:
      type: object
      additionalProperties: false
      required:
      - id
      - eventId
      - eventType
      - status
      - attempts
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - DELIVERED
          - FAILED
        attempts:
          type: integer
          minimum: 0
        lastStatusCode:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-avenra_session
      description: Server-side session (ADR-013).
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The organization. The server checks the caller's membership; the id alone grants nothing
        (ADR-005).
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Client-chosen key; repeating a request with the same key returns the first result (Guidelines
        §30).
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestLinkId:
      name: requestLinkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100000
    RequestToken:
      name: X-Avenra-Request-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 200
      description: The token from the request link. Sent in a header, never in the URL, so it does not
        reach access logs or referrers.
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
