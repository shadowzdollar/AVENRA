        the request token is the only credential (ADR-020).'
      tags:
      - client-requests
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: safe
      x-avenra-rate-limit: client-requests
      parameters:
      - $ref: '#/components/parameters/RequestToken'
      responses:
        '200':
          description: What is being asked and the state of each item.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequest'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/client-requests/current/requirements/{requirementId}/value:
    post:
      operationId: submitClientValue
      summary: Answer a requested item
      description: 'Only requirements of the link. Needs no account: the request token is the only credential
        (ADR-020).'
      tags:
      - client-requests
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: client-requests
      parameters:
      - $ref: '#/components/parameters/RequestToken'
      - $ref: '#/components/parameters/RequirementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueSubmission'
      responses:
        '201':
          description: Received.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequestItem'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/client-requests/current/requirements/{requirementId}/file:
    post:
      operationId: uploadClientFile
      summary: Upload a requested file
      description: 'Same checks as team uploads: type by content, size limit, malware scan. Needs no account:
        the request token is the only credential (ADR-020).'
      tags:
      - client-requests
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: client-uploads
      parameters:
      - $ref: '#/components/parameters/RequestToken'
      - $ref: '#/components/parameters/RequirementId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '201':
          description: Received.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequestItem'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/exceptions:
    get:
      operationId: listExceptions
      summary: List exceptions
      tags:
      - work
      x-avenra-permission: work.read
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExceptionStatus'
      - name: workId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Only this work.
      - name: open
        in: query
        required: false
        schema:
          type: boolean
        description: Only exceptions that are not resolved or dismissed.
      responses:
        '200':
          description: Exceptions, newest first (at most 200).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkException'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/exceptions/{exceptionId}:
    get:
      operationId: getException
      summary: Get an exception
      tags:
      - work
      x-avenra-permission: work.read
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ExceptionId'
      responses:
        '200':
          description: The exception.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkException'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: assignException
      summary: Assign an exception
      tags:
      - work
      x-avenra-permission: work.update
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ExceptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignExceptionRequest'
      responses:
        '200':
          description: Assigned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkException'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/exceptions/{exceptionId}/transitions:
    post:
      operationId: transitionException
      summary: Change the status of an exception
      description: Only transitions of the exception lifecycle (ADR-024) succeed (`INVALID_TRANSITION`).
        Resolving or dismissing needs a resolution. Repeating the current status returns the exception
        unchanged.
      tags:
      - work
      x-avenra-permission: work.update
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ExceptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionTransitionRequest'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkException'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/work/{workId}/executions:
    get:
      operationId: listExecutions
      summary: Automated and manual actions on work
      tags:
      - work
      x-avenra-permission: work.read
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/WorkId'
      responses:
        '200':
          description: Executions, newest first (at most 200).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Execution'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  headers:
    RequestId:
      description: Correlation id of the request, also present in error bodies and server logs.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying (on `429`).
      schema:
        type: integer
  responses:
    ClientError:
      description: The request was rejected. See `code` for the reason.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: The server failed to handle the request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiMeta:
      type: object
      additionalProperties: false
      required:
      - service
      - apiVersion
      properties:
        service:
          type: string
          description: Name of the service answering the request.
          examples:
          - avenra-api
        apiVersion:
          type: string
          description: Major version of the API contract.
          examples:
          - v1
    ErrorResponse:
      type: object
      additionalProperties: false
      description: The single error format of the API (Guidelines §34).
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples:
          - VALIDATION_FAILED
        message:
          type: string
          description: Human-readable explanation, safe to show to users.
        requestId:
          type: string
          description: Correlation id; equals the `X-Request-Id` response header.
        details:
          type: array
          description: Per-field problems, present for validation errors only.
          items:
            $ref: '#/components/schemas/FieldProblem'
    FieldProblem:
      type: object
      additionalProperties: false
      required:
      - field
      - problem
      properties:
        field:
          type: string
          description: The request field, as named in this contract.
        problem:
          type: string
          description: What is wrong with the field.
    SignUpRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters (ADR-014).
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    EmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
          description: Single-use token from an email link.
    SignInRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    SignInResult:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - SIGNED_IN
          - MFA_REQUIRED
        mfaChallengeId:
          type: string
          format: uuid
          description: Present when `status` is `MFA_REQUIRED`; valid for 5 minutes.
    MfaSignInRequest:
      type: object
      additionalProperties: false
      required:
      - mfaChallengeId
      - code
      properties:
        mfaChallengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$|^[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$
          description: A 6-digit authenticator code or a recovery code.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters (ADR-014).
    PasswordResetConfirmation:
      type: object
      additionalProperties: false
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
          description: Single-use token from an email link.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters (ADR-014).
    TotpEnrollment:
      type: object
      additionalProperties: false
      required:
      - secret
      - otpauthUri
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauthUri:
          type: string
          description: '`otpauth://` URI for a QR code.'
    TotpCodeRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$|^[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$
          description: A 6-digit authenticator code or a recovery code.
    RecoveryCodes:
      type: object
      additionalProperties: false
      required:
      - codes
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - mfaEnabled
      - organizations
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
        mfaEnabled:
          type: boolean
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
    SessionSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - current
      - createdAt
      - lastSeenAt
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        userAgent:
          type: string
          maxLength: 300
    Organization:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    OrganizationMembership:
      type: object
      additionalProperties: false
      required:
      - organization
      - membershipId
      - role
      - permissions
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membershipId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
          description: Permissions granted by the role, for the interface to adapt; the server checks
            them independently.
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    Member:
      type: object
      additionalProperties: false
      required:
      - membershipId
      - userId
      - email
      - displayName
      - role
      - joinedAt
      properties:
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    InviteRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
    Invitation:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - role
      - invitedAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
        invitedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Role:
      type: string
      enum:
      - OWNER
      - ADMIN
      - MANAGER
      - MEMBER
      - VIEWER
      description: Role within an organization (Guidelines §18).
    ClientInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
          description: Default contact address.
        reference:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization's own reference for the client.
    Client:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        reference:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        clientId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 0
          maxLength: 4000
    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clientId:
          type: string
          format: uuid
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkStatus:
      type: string
      enum:
      - DRAFT
      - READY
      - RUNNING
      - WAITING_FOR_INFORMATION
      - WAITING_FOR_APPROVAL
      - BLOCKED
      - FAILED
      - COMPLETED
      - CANCELLED
      description: Lifecycle of work (Guidelines §19, ADR-018).
    Priority:
      type: string
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
    CreateWorkRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 10000
        type:
          type: string
          minLength: 1
          maxLength: 60
          description: Kind of work, e.g. `onboarding`.
        priority:
          $ref: '#/components/schemas/Priority'
        clientId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        ownerMembershipId:
          type: string
          format: uuid
          description: The member responsible; defaults to the creator.
    UpdateWorkRequest:
      type: object
      additionalProperties: false
      description: Only the fields present are changed.
      required: []
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 10000
        type:
          type: string
          minLength: 1
          maxLength: 60
        priority:
          $ref: '#/components/schemas/Priority'
        dueAt:
          type: string
          format: date-time
        ownerMembershipId:
          type: string
          format: uuid
    Completeness:
      type: object
      additionalProperties: false
      description: Computed by the server from the requirements (ADR-018).
      required:
      - required
      - accepted
      - awaitingReview
      - missing
      - rejected
      - complete
      properties:
        required:
          type: integer
          minimum: 0
          description: Required requirements.
        accepted:
          type: integer
          minimum: 0
          description: Required requirements accepted.
        awaitingReview:
          type: integer
          minimum: 0
        missing:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
          description: Waiting for a correction.
        complete:
          type: boolean
          description: Every required requirement is accepted.
    WorkSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - status
      - priority
      - completeness
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
        status:
          $ref: '#/components/schemas/WorkStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        clientId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        ownerMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        completeness:
          $ref: '#/components/schemas/Completeness'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        openExceptions:
          type: integer
          minimum: 0
    WorkDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - status
      - priority
      - completeness
      - requestedByUserId
      - createdAt
      - updatedAt
      - requirements
      - tasks
      - allowedTransitions
      - progress
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
        status:
          $ref: '#/components/schemas/WorkStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        clientId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        ownerMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        completeness:
          $ref: '#/components/schemas/Completeness'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        description:
          type: string
        requestedByUserId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        completionReason:
          type: string
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkStatus'
          description: Statuses reachable from the current one.
        progress:
          $ref: '#/components/schemas/Progress'
    TransitionRequest:
      type: object
      additionalProperties: false
      required:
      - to
      - expectedStatus
      properties:
        to:
          $ref: '#/components/schemas/WorkStatus'
        expectedStatus:
          $ref: '#/components/schemas/WorkStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why; required for `BLOCKED`, `FAILED` and `CANCELLED`.
    WorkTransition:
      type: object
      additionalProperties: false
      required:
      - id
      - to
      - at
      properties:
        id:
          type: string
          format: uuid
        from:
          $ref: '#/components/schemas/WorkStatus'
        to:
          $ref: '#/components/schemas/WorkStatus'
        actorUserId:
          type: string
          format: uuid
        reason:
          type: string
        at:
          type: string
          format: date-time
        actorRule:
          type: string
          description: Set when the platform moved the work (ADR-023).
    TaskStatus:
      type: string
      enum:
      - OPEN
      - DONE
      - CANCELLED
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - completionCondition
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        completionCondition:
          type: string
          minLength: 1
          maxLength: 1000
          description: What must be true for the task to be done (Guidelines §20).
        assigneeMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
    TaskStatusRequest:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - DONE
          - CANCELLED
        note:
          type: string
          minLength: 1
          maxLength: 1000
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - kind
      - completionCondition
      - status
      - createdAt
      - origin
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
          enum:
          - HUMAN
        completionCondition:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        assigneeMembershipId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        note:
          type: string
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        origin:
          type: string
          enum:
          - MANUAL
          - SYSTEM
          description: System tasks are created and closed by the platform (ADR-024).
        requiredAction:
          type: string
        reason:
          type: string
        choices:
          type: array
          items:
            type: string
        about:
          $ref: '#/components/schemas/Reference'
    RequirementKind:
      type: string
      enum:
      - DOCUMENT
      - TEXT
      - NUMBER
      - DATE
      - BOOLEAN
      description: 'What satisfies the requirement: a file, or a value of a type.'
    RequirementState:
      type: string
      enum:
      - MISSING
      - SUBMITTED
      - ACCEPTED
      - REJECTED
      description: Derived from the current information item (ADR-018).
    CreateRequirementRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - kind
      - required
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        instructions:
          type: string
          minLength: 0
          maxLength: 2000
          description: Shown to the client.
        kind:
          $ref: '#/components/schemas/RequirementKind'
        required:
          type: boolean
    Requirement:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - kind
      - required
      - state
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        kind:
          $ref: '#/components/schemas/RequirementKind'
        required:
          type: boolean
        state:
          $ref: '#/components/schemas/RequirementState'
        currentItem:
          $ref: '#/components/schemas/InformationItem'
        createdAt:
          type: string
          format: date-time
    ValueSubmission:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4000
          description: Text; a decimal number (`NUMBER`); `YYYY-MM-DD` (`DATE`); `true` or `false` (`BOOLEAN`).
    FileUpload:
      type: object
      additionalProperties: false
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: At most 25 MB; PDF, Word, Excel, PowerPoint, CSV, text, PNG or JPEG.
    InformationSource:
      type: object
      additionalProperties: false
      description: Where the information came from (Guidelines §136).
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - CLIENT_LINK
          - TEAM_MEMBER
        requestLinkId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    VerificationState:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - REJECTED
    InformationItem:
      type: object
      additionalProperties: false
      required:
      - id
      - requirementId
      - kind
      - source
      - receivedAt
      - verification
      properties:
        id:
          type: string
          format: uuid
        requirementId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/RequirementKind'
        value:
          type: string
          description: Present for value requirements.
        document:
          $ref: '#/components/schemas/DocumentVersion'
        source:
          $ref: '#/components/schemas/InformationSource'
        receivedAt:
          type: string
          format: date-time
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Set by automated verification (Phase 5).
        verification:
          $ref: '#/components/schemas/Verification'
    Verification:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          $ref: '#/components/schemas/VerificationState'
        reviewedByUserId:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        reason:
          type: string
    DocumentVersion:
      type: object
      additionalProperties: false
      required:
      - documentId
      - version
      - fileName
      - contentType
      - sizeBytes
      - sha256
      - scanStatus
      - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        fileName:
          type: string
        contentType:
          type: string
          description: Detected from the content, not declared by the uploader.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        scanStatus:
          type: string
          enum:
          - CLEAN
          - INFECTED
        uploadedAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      additionalProperties: false
      required:
      - itemId
      - decision
      properties:
        itemId:
          type: string
          format: uuid
          description: The item being reviewed; must be the current one.
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required when rejecting; shown to the client.
    CreateRequestLinkRequest:
      type: object
      additionalProperties: false
      required:
      - recipientEmail
      - requirementIds
      properties:
        recipientEmail:
          type: string
          format: email
          maxLength: 254
        recipientName:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 0
          maxLength: 2000
          description: Shown to the client with the request.
        requirementIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Requirements of this work the link covers; duplicates are ignored.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 14
    RequestLink:
      type: object
      additionalProperties: false
      required:
      - id
      - recipientEmail
      - requirementIds
      - status
      - createdAt
      - expiresAt
      - remindersSent
      properties:
        id:
          type: string
          format: uuid
        recipientEmail:
          type: string
          format: email
        recipientName:
          type: string
        message:
          type: string
        requirementIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - REVOKED
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastOpenedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        remindersSent:
          type: integer
          minimum: 0
        lastRemindedAt:
          type: string
          format: date-time
    ClientRequest:
      type: object
      additionalProperties: false
      description: 'What a request link shows: only its own requirements, never earlier files or other
        work.'
      required:
      - organizationName
      - workTitle
      - recipient
      - expiresAt
      - items
      properties:
        organizationName:
          type: string
        workTitle:
          type: string
        recipient:
          type: string
          description: The recipient's email address, masked.
        message:
          type: string
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientRequestItem'
    ClientRequestItem:
      type: object
      additionalProperties: false
      required:
      - requirementId
      - title
      - kind
      - required
      - state
      properties:
        requirementId:
          type: string
          format: uuid
        title:
          type: string
        instructions:
          type: string
        kind:
          $ref: '#/components/schemas/RequirementKind'
        required:
          type: boolean
        state:
          $ref: '#/components/schemas/RequirementState'
        rejectionReason:
          type: string
          description: Why the last answer was not accepted.
        acceptedFileTypes:
          type: array
          items:
            type: string
          description: 'For documents: accepted file extensions.'
    ExceptionStatus:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - WAITING
      - RESOLVED
      - DISMISSED
    WorkException:
      type: object
      additionalProperties: false
      description: 'A business exception: a normal state that needs a person (Guidelines §26, ADR-024).'
      required:
      - id
      - type
      - severity
      - description
      - source
      - status
      - createdAt
      - allowedTransitions
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - JOB_FAILED
          - DELIVERY_FAILED
          - REQUEST_EXPIRED_INCOMPLETE
          - WORK_OVERDUE
          - MALWARE_FOUND
          - HUMAN_REQUIRED
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        description:
          type: string
          description: What happened and what is needed.
        source:
          type: object
          additionalProperties: false
          description: What raised the exception.
          required:
          - type
          - id
          properties:
            type:
              type: string
            id:
              type: string
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        assigneeMembershipId:
          type: string
          format: uuid
        resolution:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        resolvedByUserId:
          type: string
          format: uuid
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionStatus'
    ExceptionTransitionRequest:
      type: object
      additionalProperties: false
      required:
      - to
      - expectedStatus
      properties:
        to:
          $ref: '#/components/schemas/ExceptionStatus'
        expectedStatus:
          $ref: '#/components/schemas/ExceptionStatus'
        resolution:
          type: string
          minLength: 1
          maxLength: 2000
          description: Required for `RESOLVED` and `DISMISSED`.
    AssignExceptionRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        assigneeMembershipId:
          type:
          - string
          - 'null'
          format: uuid
          description: The member responsible; null to unassign.
    Execution:
      type: object
      additionalProperties: false
      description: One attempt to perform an action (Guidelines §28, ADR-023).
      required:
      - id
      - actor
      - action
      - status
      - retryCount
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        step:
          $ref: '#/components/schemas/Reference'
        actor:
          type: object
          additionalProperties: false
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - USER
              - SYSTEM
            userId:
              type: string
              format: uuid
            rule:
              type: string
              description: 'For system actions: the rule that acted.'
        action:
          type: string
          examples:
          - request_link.remind
        target:
          type: string
        status:
          type: string
          enum:
          - PLANNED
          - AUTHORIZED
          - READY
          - RUNNING
          - WAITING
          - REQUIRES_APPROVAL
          - FAILED
          - SUCCEEDED
          - VERIFIED
          - COMPLETED
          - CANCELLED
        result:
          type: object
          additionalProperties:
            type: string
          description: What the action produced, as named values.
        error:
          type: string
        retryCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    Progress:
      type: object
      additionalProperties: false
      description: What a person needs to know without reading logs (Guidelines §107).
      required:
      - currentStep
      - nextAction
      properties:
        currentStep:
          type: string
          description: Where the work stands, in words.
        nextAction:
          type: string
          description: What happens next and who does it.
        blockedReason:
          type: string
        openExceptions:
          type: integer
          minimum: 0
        openTasks:
          type: integer
          minimum: 0
    Reference:
      type: object
      additionalProperties: false
      description: 'Points at another resource: its kind and id.'
      required:
      - type
      - id
      properties:
        type:
          type: string
          examples:
          - requirement
        id:
          type: string
          format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-avenra_session
      description: Server-side session (ADR-013).
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The organization. The server checks the caller's membership; the id alone grants nothing
        (ADR-005).
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Client-chosen key; repeating a request with the same key returns the first result (Guidelines
        §30).
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequirementId:
      name: requirementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestLinkId:
      name: requestLinkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100000
    RequestToken:
      name: X-Avenra-Request-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 200
      description: The token from the request link. Sent in a header, never in the URL, so it does not
        reach access logs or referrers.
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
