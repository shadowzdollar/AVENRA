openapi: 3.1.1
info:
  title: Avenra API
  version: 1.0.0
  description: "Public API of the Avenra business work execution platform.\n\nThis file is the source\
    \ of truth for the API (ADR-008). Java server\ninterfaces and the TypeScript client are generated\
    \ from it.\n\nEvery operation declares, through `x-avenra-*` extensions, the rules\nfrom Guidelines\
    \ §32 that OpenAPI cannot express directly:\n\n- `x-avenra-permission`: `public`, `authenticated`\
    \ (any signed-in user),\n  or the permission required, checked in the organization named by the path\n\
    - `x-avenra-audit`: `required` or `none`\n- `x-avenra-idempotency`: `safe` (no side effects), `idempotent`,\
    \ or\n  `key-required` (an `Idempotency-Key` header must be sent)\n- `x-avenra-rate-limit`: `default`\
    \ or a named policy\n\nEvery error response uses the `ErrorResponse` schema and carries the\n`X-Request-Id`\
    \ header.\n\nAuthentication uses a server-side session cookie on the same origin as the\nweb application\
    \ (ADR-013). State-changing requests must also send the CSRF\ntoken from the `XSRF-TOKEN` cookie in\
    \ the `X-XSRF-TOKEN` header.\n"
  license:
    name: Proprietary
    identifier: LicenseRef-Avenra-Proprietary
servers:
- url: /
security:
- sessionCookie: []
tags:
- name: platform
  description: Technical information about the API itself.
- name: authentication
  description: Accounts, sessions, passwords and multi-factor authentication.
- name: organizations
  description: Organizations, members, roles and invitations.
- name: clients
  description: The organization's clients.
- name: projects
  description: Projects that group work.
- name: work
  description: Work, its lifecycle, tasks, requirements, information and documents.
- name: information
  description: Requirements, the answers submitted for them, their review, and documents.
- name: requests
  description: Request links that ask clients for information.
- name: client-requests
  description: Public operations used by clients holding a request link.
- name: ai
  description: 'AI document reading: the organization setting and usage records.'
- name: agents
  description: 'Agent runs: plans proposed by the assistant, approved by people, run through the tool
    gateway.'
- name: integrations
  description: 'Connections to other systems: signed webhooks and storage export (ADR-034).'
paths:
  /api/v1/meta:
    get:
      operationId: getApiMeta
      summary: Describe this API
      description: Returns the service name and API version. Safe to call without authentication.
      tags:
      - platform
      security: []
      x-avenra-permission: public
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      responses:
        '200':
          description: The API description.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMeta'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue a CSRF token
      description: Call once before the first state-changing request (ADR-013).
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      responses:
        '204':
          description: The token is set in the readable `XSRF-TOKEN` cookie; send it back in `X-XSRF-TOKEN`
            on state-changing requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/sign-up:
    post:
      operationId: signUp
      summary: Create an account
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: sign-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '202':
          description: Accepted. A verification email is sent. The response is the same whether or not
            the email is already registered, so it does not reveal accounts.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/email-verification:
    post:
      operationId: verifyEmail
      summary: Verify an email address
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: token-check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: The email address is verified.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/email-verification/resend:
    post:
      operationId: resendVerificationEmail
      summary: Send a new verification email
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: none
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: email-send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. The response does not reveal whether the address exists.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email and password
      description: An unknown email and a wrong password both answer `INVALID_CREDENTIALS` after the same
        hashing effort. Only a correct password for an unverified account answers `EMAIL_NOT_VERIFIED`.
        Repeated attempts per account answer `RATE_LIMITED`.
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in, or a second factor is required.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: The `__Host-avenra_session` cookie (HttpOnly, Secure, SameSite=Lax).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/sign-in/mfa:
    post:
      operationId: completeMfaSignIn
      summary: Complete sign-in with a second factor
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: mfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSignInRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: The `__Host-avenra_session` cookie (HttpOnly, Secure, SameSite=Lax).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out of this session
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      responses:
        '204':
          description: Signed out; the session cookie is cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Describe the signed-in user and their organizations
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      responses:
        '200':
          description: The current user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in user's active sessions
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      responses:
        '200':
          description: Active sessions.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: revokeOtherSessions
      summary: Sign out everywhere else
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      responses:
        '204':
          description: All other sessions are revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one session
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: The session is revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/password:
    put:
      operationId: changePassword
      summary: Change the password
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Changed. All other sessions are revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: password-reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. The response does not reveal whether the address exists.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      tags:
      - authentication
      security: []
      x-avenra-permission: public
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: token-check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204':
          description: The password is changed and all sessions are revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/mfa/totp:
    post:
      operationId: startTotpEnrollment
      summary: Start setting up an authenticator app
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: mfa
      responses:
        '200':
          description: The secret to add to an authenticator app. MFA is not active until confirmed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: disableTotp
      summary: Turn off authenticator-app MFA
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: mfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '204':
          description: MFA is off.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/mfa/totp/activation:
    post:
      operationId: activateTotp
      summary: Confirm the authenticator app and turn MFA on
      tags:
      - authentication
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: mfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
      responses:
        '200':
          description: MFA is on. The recovery codes are shown only once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List the organizations the user belongs to
      tags:
      - organizations
      x-avenra-permission: authenticated
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      responses:
        '200':
          description: Organizations with the user's role in each.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationMembership'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createOrganization
      summary: Create an organization
      tags:
      - organizations
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: key-required
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created; the creator is its owner.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}:
    get:
      operationId: getOrganization
      summary: Get an organization
      tags:
      - organizations
      x-avenra-permission: organization.read
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: The organization.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateOrganization
      summary: Rename an organization
      tags:
      - organizations
      x-avenra-permission: organization.manage
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/members:
    get:
      operationId: listMembers
      summary: List members
      tags:
      - organizations
      x-avenra-permission: members.read
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Members and their roles.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/members/{membershipId}:
    patch:
      operationId: changeMemberRole
      summary: Change a member's role
      description: An organization always keeps at least one owner (`LAST_OWNER`).
      tags:
      - organizations
      x-avenra-permission: members.manage
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: removeMember
      summary: Remove a member
      description: An organization always keeps at least one owner (`LAST_OWNER`).
      tags:
      - organizations
      x-avenra-permission: members.manage
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
      responses:
        '204':
          description: Removed; the person's sessions lose access immediately.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/invitations:
    get:
      operationId: listInvitations
      summary: List pending invitations
      tags:
      - organizations
      x-avenra-permission: members.read
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Pending invitations.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
    post:
      operationId: inviteMember
      summary: Invite someone by email
      tags:
      - organizations
      x-avenra-permission: members.manage
      x-avenra-audit: required
      x-avenra-idempotency: key-required
      x-avenra-rate-limit: invitations
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invited; an email is sent.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/organizations/{organizationId}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an invitation
      tags:
      - organizations
      x-avenra-permission: members.manage
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: default
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /api/v1/invitations/acceptance:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: The signed-in user's verified email must match the invitation.
      tags:
      - organizations
      x-avenra-permission: authenticated
      x-avenra-audit: required
      x-avenra-idempotency: idempotent
      x-avenra-rate-limit: token-check
      requestBody:
        required: true
        content:
          application/json:
            schema:
