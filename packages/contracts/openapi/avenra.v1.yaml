openapi: 3.1.1

info:
  title: Avenra API
  version: 1.0.0
  description: |
    Public API of the Avenra business work execution platform.

    This file is the source of truth for the API (ADR-008). Java server
    interfaces and the TypeScript client are generated from it.

    Every operation declares, through `x-avenra-*` extensions, the rules
    from Guidelines §32 that OpenAPI cannot express directly:

    - `x-avenra-permission`: the permission required (`public` if none)
    - `x-avenra-audit`: `required` or `none`
    - `x-avenra-idempotency`: `safe` (no side effects), `idempotent`, or
      `key-required` (an `Idempotency-Key` header must be sent)
    - `x-avenra-rate-limit`: `default` or a named policy

    Every error response uses the `ErrorResponse` schema and carries the
    `X-Request-Id` header.
  license:
    name: Proprietary
    identifier: LicenseRef-Avenra-Proprietary

servers:
  - url: /

tags:
  - name: platform
    description: Technical information about the API itself.

paths:
  /api/v1/meta:
    get:
      operationId: getApiMeta
      summary: Describe this API
      description: Returns the service name and API version. Safe to call without authentication.
      tags: [platform]
      security: []
      x-avenra-permission: public
      x-avenra-audit: none
      x-avenra-idempotency: safe
      x-avenra-rate-limit: default
      responses:
        "200":
          description: The API description.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMeta"
        "4XX":
          $ref: "#/components/responses/ClientError"
        "5XX":
          $ref: "#/components/responses/ServerError"

components:
  headers:
    RequestId:
      description: Correlation id of the request, also present in error bodies and server logs.
      schema:
        type: string

  responses:
    ClientError:
      description: The request was rejected. See `code` for the reason.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: The server failed to handle the request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiMeta:
      type: object
      additionalProperties: false
      required: [service, apiVersion]
      properties:
        service:
          type: string
          description: Name of the service answering the request.
          examples: [avenra-api]
        apiVersion:
          type: string
          description: Major version of the API contract.
          examples: [v1]

    ErrorResponse:
      type: object
      additionalProperties: false
      description: The single error format of the API (Guidelines §34).
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          examples: [VALIDATION_FAILED]
        message:
          type: string
          description: Human-readable explanation, safe to show to users.
        requestId:
          type: string
          description: Correlation id; equals the `X-Request-Id` response header.
        details:
          type: array
          description: Per-field problems, present for validation errors only.
          items:
            $ref: "#/components/schemas/FieldProblem"

    FieldProblem:
      type: object
      additionalProperties: false
      required: [field, problem]
      properties:
        field:
          type: string
          description: The request field, as named in this contract.
        problem:
          type: string
          description: What is wrong with the field.
