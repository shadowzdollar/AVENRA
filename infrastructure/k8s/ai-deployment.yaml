apiVersion: apps/v1
kind: Deployment
metadata:
  name: avenra-ai
  namespace: avenra
  labels:
    app.kubernetes.io/name: avenra-ai
    app.kubernetes.io/component: ai-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: avenra-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: avenra-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: avenra-ai
          image: avenra/ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - configMapRef:
                name: avenra-config
            - secretRef:
                name: avenra-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: avenra-ai
  namespace: avenra
spec:
  selector:
    app.kubernetes.io/name: avenra-ai
  ports:
    - port: 8090
      targetPort: 8090
      name: http
