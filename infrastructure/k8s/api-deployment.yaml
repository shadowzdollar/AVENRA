apiVersion: apps/v1
kind: Deployment
metadata:
  name: avenra-api
  namespace: avenra
  labels:
    app.kubernetes.io/name: avenra-api
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: avenra-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: avenra-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: avenra-api
          image: avenra/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: avenra-config
            - secretRef:
                name: avenra-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: avenra-api
  namespace: avenra
spec:
  selector:
    app.kubernetes.io/name: avenra-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
