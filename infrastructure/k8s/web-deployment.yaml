apiVersion: apps/v1
kind: Deployment
metadata:
  name: avenra-web
  namespace: avenra
  labels:
    app.kubernetes.io/name: avenra-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: avenra-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: avenra-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: avenra-web
          image: avenra/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: AVENRA_API_INTERNAL_URL
              value: "http://avenra-api:8080"
          envFrom:
            - configMapRef:
                name: avenra-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: avenra-web
  namespace: avenra
spec:
  selector:
    app.kubernetes.io/name: avenra-web
  ports:
    - port: 3000
      targetPort: 3000
      name: http
