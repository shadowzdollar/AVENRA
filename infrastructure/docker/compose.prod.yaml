# AVENRA Production Multi-Container Composition (Phase 13)
# Usage:
#   docker compose -f infrastructure/docker/compose.prod.yaml --env-file .env.production up -d --build

name: avenra-prod

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?required in .env.production}
      AVENRA_DB_NAME: ${POSTGRES_DB:-avenra}
      AVENRA_DB_OWNER_USER: ${AVENRA_DB_OWNER_USER:-avenra_owner}
      AVENRA_DB_OWNER_PASSWORD: ${AVENRA_DB_OWNER_PASSWORD:?required}
      AVENRA_DB_APP_USER: ${AVENRA_DB_APP_USER:-avenra_app}
      AVENRA_DB_APP_PASSWORD: ${AVENRA_DB_APP_PASSWORD:?required}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-avenra}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-tier

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-tier

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"avenra","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -ip.bind=0.0.0.0
    volumes:
      - seaweedfs-prod-data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-tier

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 30M
      CLAMD_CONF_MaxFileSize: 30M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal-tier

  avenra-ai:
    build:
      context: ../..
      dockerfile: apps/ai/Dockerfile
    restart: unless-stopped
    environment:
      AVENRA_AI_ENVIRONMENT: PRODUCTION
      AVENRA_AI_SERVICE_TOKEN: ${AVENRA_AI_SERVICE_TOKEN:?required}
      AVENRA_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AVENRA_AI_MODEL: ${AVENRA_AI_MODEL:-claude-sonnet-5-5}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health/liveness', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal-tier

  avenra-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-avenra}
      AVENRA_DB_APP_USER: ${AVENRA_DB_APP_USER:-avenra_app}
      AVENRA_DB_APP_PASSWORD: ${AVENRA_DB_APP_PASSWORD:?required}
      AVENRA_DB_OWNER_USER: ${AVENRA_DB_OWNER_USER:-avenra_owner}
      AVENRA_DB_OWNER_PASSWORD: ${AVENRA_DB_OWNER_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-avenra-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
      AVENRA_AI_URL: http://avenra-ai:8090
      AVENRA_AI_SERVICE_TOKEN: ${AVENRA_AI_SERVICE_TOKEN:?required}
      AVENRA_AUTH_KEY_RING: ${AVENRA_AUTH_KEY_RING:?required}
      AVENRA_AUTH_ACTIVE_KEY_ID: ${AVENRA_AUTH_ACTIVE_KEY_ID:?required}
      AVENRA_CRYPTO_KEY_RING: ${AVENRA_CRYPTO_KEY_RING:?required}
      AVENRA_CRYPTO_ACTIVE_KEY_ID: ${AVENRA_CRYPTO_ACTIVE_KEY_ID:?required}
      AVENRA_BILLING_PROVIDER: ${AVENRA_BILLING_PROVIDER:-stripe}
      AVENRA_BILLING_WEBHOOK_SECRET: ${AVENRA_BILLING_WEBHOOK_SECRET:-}
      AVENRA_BILLING_STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
      avenra-ai:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-tier

  avenra-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AVENRA_API_INTERNAL_URL: http://avenra-api:8080
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://avenra.com}
    depends_on:
      avenra-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal-tier
      - edge-tier

  edge-proxy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      avenra-web:
        condition: service_healthy
    networks:
      - edge-tier
      - internal-tier

networks:
  internal-tier:
    internal: true
  edge-tier:
    driver: bridge

volumes:
  postgres-prod-data:
  seaweedfs-prod-data:
  caddy-data:
  caddy-config:
